# GitHub에 코드가 올라갈 때마다 자동으로 점검해요 (빌드 + 화면 열림 확인)
name: 자동 점검

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
