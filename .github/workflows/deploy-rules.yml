# Firestore 보안 규칙 자동 게시: main에 규칙 파일(firebase/firestore.rules)이 바뀌어 합쳐지면 Firebase에 자동으로 올려요.
# 한 번만 준비: GitHub 저장소 Settings → Secrets and variables → Actions 에 FIREBASE_SERVICE_ACCOUNT(서비스 계정 키 JSON 전체)를 넣으면 돼요.
# 열쇠가 없으면 게시를 건너뛰고 안내만 남겨요(실패로 표시하지 않음).
name: 규칙 자동 게시
on:
  push:
    branches: [main]
    paths: ["firebase/firestore.rules"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 열쇠 확인
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT 열쇠가 없어서 규칙 게시를 건너뛰어요. 콘솔에서 직접 게시하거나 열쇠를 넣어 주세요."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          fi
      - name: 규칙 게시
        if: env.SKIP != '1'
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '{ "firestore": { "rules": "firestore.rules" } }' > firebase.json
          npx --yes firebase-tools@15.34.0 deploy --only firestore:rules --project bird-letter --non-interactive
      - name: 열쇠 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
