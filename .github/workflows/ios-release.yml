# 아이폰 앱을 만들어 App Store Connect(TestFlight)에 올려요. 맥 없이 GitHub 서버(맥)에서 돌아요.
# 직접 실행: GitHub → Actions → "아이폰 앱 올리기(TestFlight)" → Run workflow
# 필요한 비밀 값(저장소 Settings → Secrets and variables → Actions, 채팅에 붙이지 마세요):
#   APPLE_TEAM_ID   애플 개발자 팀 번호(10글자, developer.apple.com/account → 멤버십 세부 정보)
#   ASC_KEY_ID      App Store Connect API 키 ID(10글자)
#   ASC_ISSUER_ID   같은 화면 위쪽의 발급자 ID(긴 번호)
#   ASC_KEY_P8      받은 AuthKey_XXXX.p8 파일 내용 전체(-----BEGIN PRIVATE KEY----- 부터 끝까지)
# 키는 "관리자(Admin)" 권한으로 만들어야 서명 인증서·프로필을 자동으로 만들 수 있어요 「미확인」.
# App Store Connect에 앱(번들 ID com.saepyeonji.app)을 먼저 한 번 만들어 둬야 올라가요.
name: 아이폰 앱 올리기(TestFlight)

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 열쇠가 다 있는지 확인
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""
          for k in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!k}" ] || miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "::error::비밀 값이 없어요:$miss (docs/아이폰-출시.md 참고)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 아이폰 프로젝트·아이콘·로그인 설정·버전 준비
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/ios-prepare.sh
      - name: 자동 올리기 열쇠 파일
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          # 붙여 넣는 방식이 달라도 받아 줘요: 파일 전체 / 가운데 글자만(머리·꼬리 줄 없이) / base64로 한 번 더 감싼 것
          RAW=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')
          BODY=$(printf '%s' "$RAW" | tr -d ' \n\t')
          if printf '%s' "$RAW" | grep -q "PRIVATE KEY-----"; then
            printf '%s\n' "$RAW" > "$KEY"
          elif DEC=$(printf '%s' "$BODY" | base64 --decode 2>/dev/null) && printf '%s' "$DEC" | grep -q "PRIVATE KEY-----"; then
            printf '%s\n' "$DEC" > "$KEY"
          elif printf '%s' "$BODY" | grep -Eq '^[A-Za-z0-9+/=]{100,}$'; then
            { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          else
            echo "::error::ASC_KEY_P8 값이 .p8 파일 내용이 아니에요(글자 ${#BODY}자). AuthKey_….p8 파일을 텍스트 편집기로 열어 -----BEGIN PRIVATE KEY----- 부터 끝까지 전부 붙여 넣어 주세요."; exit 1
          fi
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 열쇠를 읽을 수 없어요(글자 ${#BODY}자, 보통 약 200자). .p8 파일 내용을 처음부터 끝까지 다시 붙여 넣어 주세요."; exit 1
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      # 자동 서명은 "등록된 아이폰이 없다"며 개발용 프로필에서 막혀서(2026-10-30), 배포용 인증서·App Store 프로필을 API로 만들어 손으로 서명해요
      - name: 서명 준비(배포용 인증서·App Store 프로필)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node scripts/ios-signing.mjs create
          KC="$RUNNER_TEMP/build.keychain-db"; KCP=$(openssl rand -hex 12)
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$RUNNER_TEMP/signing/dist.p12" -P "$(cat "$RUNNER_TEMP/signing/p12pass")" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: 앱 만들기(아카이브)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # 앱(App) 칸에만 손 서명 설정을 넣어요(SPM 부품에는 프로필을 안 붙여야 해서 명령줄 대신 프로젝트 파일에)
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g; s/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' "$PBX"
          sed -i '' "s#PRODUCT_BUNDLE_IDENTIFIER = com.saepyeonji.app;#DEVELOPMENT_TEAM = $APPLE_TEAM_ID;\\
          				PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";\\
          				PRODUCT_BUNDLE_IDENTIFIER = com.saepyeonji.app;#" "$PBX"
          grep -n "PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY" "$PBX"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive | tail -80
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "::error::아카이브가 만들어지지 않았어요(위 오류 확인)"; exit 1; }
          codesign -d --entitlements :- "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" 2>/dev/null | grep -E "aps-environment|applesignin|application-identifier" || true
      - name: App Store Connect(TestFlight)에 올리기
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.saepyeonji.app</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "올렸어요. 10~30분 뒤 App Store Connect → TestFlight에 빌드 ${{ github.run_number }} 이 보여요."
      - name: 정리(이번에 만든 인증서·프로필·열쇠 지우기)
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -n "$ASC_KEY_PATH" ] && [ -f "$ASC_KEY_PATH" ] && node scripts/ios-signing.mjs cleanup || true
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/AuthKey.p8"
