# 아이폰 앱을 만들어 App Store Connect(TestFlight)에 올려요. 맥 없이 GitHub 서버(맥)에서 돌아요.
# 직접 실행: GitHub → Actions → "아이폰 앱 올리기(TestFlight)" → Run workflow
# 필요한 비밀 값(저장소 Settings → Secrets and variables → Actions, 채팅에 붙이지 마세요):
#   APPLE_TEAM_ID   애플 개발자 팀 번호(10글자, developer.apple.com/account → 멤버십 세부 정보)
#   ASC_KEY_ID      App Store Connect API 키 ID(10글자)
#   ASC_ISSUER_ID   같은 화면 위쪽의 발급자 ID(긴 번호)
#   ASC_KEY_P8      받은 AuthKey_XXXX.p8 파일 내용 전체(-----BEGIN PRIVATE KEY----- 부터 끝까지)
# 키는 "관리자(Admin)" 권한으로 만들어야 서명 인증서·프로필을 자동으로 만들 수 있어요 「미확인」.
# App Store Connect에 앱(번들 ID com.saepyeonji.app)을 먼저 한 번 만들어 둬야 올라가요.
name: 아이폰 앱 올리기(TestFlight)

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 열쇠가 다 있는지 확인
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""
          for k in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!k}" ] || miss="$miss $k"; done
          if [ -n "$miss" ]; then echo "::error::비밀 값이 없어요:$miss (docs/아이폰-출시.md 참고)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 아이폰 프로젝트·아이콘·로그인 설정·버전 준비
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/ios-prepare.sh
      - name: 앱 만들기(아카이브)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else printf '%s' "$ASC_KEY_P8" | base64 -d > "$KEY"; fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -60
      - name: App Store Connect(TestFlight)에 올리기
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "올렸어요. 10~30분 뒤 App Store Connect → TestFlight에 빌드 ${{ github.run_number }} 이 보여요."
