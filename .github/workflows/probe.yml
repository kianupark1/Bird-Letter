# 배포된 사이트의 카카오 서버 입구가 켜져 있는지 확인해요(열쇠가 없으면 503, 있으면 401·400).
name: 카카오 입구 확인

on:
  push:
    branches: [claude/exciting-shannon-lbcyf3]
    paths:
      - .github/workflows/probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 카카오 입구 응답 코드
        run: |
          for body in '{}' '{"code":"abcdefgh","idToken":"x.y.z"}'; do
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST -H "content-type: application/json" -d "$body" https://bird-letter.vercel.app/api/auth/kakao)
            echo "POST /api/auth/kakao body=$body -> $code $(cat /tmp/out.txt)"
          done
          echo "GET /auth/kakao -> $(curl -s -o /dev/null -w '%{http_code}' https://bird-letter.vercel.app/auth/kakao)"
          echo "GET /settings -> $(curl -s -o /dev/null -w '%{http_code}' https://bird-letter.vercel.app/settings)"
          echo "kakao REST key in page bundle: $(curl -s https://bird-letter.vercel.app/settings | grep -o '_next/static/chunks/[^"]*\.js' | head -40 | while read f; do curl -s https://bird-letter.vercel.app/$f; done | grep -c '58b5f90a877553a0')"
