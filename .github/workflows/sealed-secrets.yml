# 비밀 값을 대표님 손 없이 넣는 작업(2026-11-10, 대표님: "자동화할 수 있는 건 다").
# 1) action=pubkey: 이 레포의 공개 자물쇠(public key)를 보여 줘요(공개돼도 되는 값).
# 2) 개발팀이 그 자물쇠로 값을 잠가서 native/sealed-secrets.json에 넣어요(잠근 값은 GitHub만 열 수 있어서 공개 저장소에 있어도 안전).
# 3) action=apply: 잠근 값을 그대로 레포 비밀 값으로 넣어요. 넣은 뒤 파일은 지워요.
# GH_SECRETS_TOKEN(이 레포 Secrets 쓰기 권한 토큰)이 있어야 해요.
name: 비밀 값 넣기(잠근 값)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "pubkey 또는 apply"
        default: "pubkey"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 공개 자물쇠 보기 / 잠근 값 넣기
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_SECRETS_TOKEN이 없어요"; exit 1; fi
          if [ "$ACTION" = "pubkey" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --jq '"KEY_ID=" + .key_id + " KEY=" + .key'
            exit 0
          fi
          f=native/sealed-secrets.json
          [ -s "$f" ] || { echo "::error::$f 가 없어요"; exit 1; }
          kid=$(node -e 'console.log(require("./native/sealed-secrets.json").key_id)')
          for name in $(node -e 'console.log(Object.keys(require("./native/sealed-secrets.json").secrets).join(" "))'); do
            val=$(node -e 'console.log(require("./native/sealed-secrets.json").secrets[process.argv[1]])' "$name")
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/secrets/$name" -f encrypted_value="$val" -f key_id="$kid" >/dev/null && echo "✓ $name 넣음"
          done
