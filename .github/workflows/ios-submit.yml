# 앱스토어 심사 제출(버튼 없이). GitHub → Actions → "아이폰 심사 제출" → Run workflow
# submit 칸을 yes로 하면 실제 제출, 비워 두면 버전·글·빌드만 준비하고 멈춰요. 출시는 승인 뒤 대표님이 [이 버전 출시].
name: 아이폰 심사 제출

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "yes = 심사 제출 / 빈칸 = 준비만"
        required: false
        default: ""
      whats_new:
        description: "이번 버전의 새로운 기능(빈칸이면 기본 글)"
        required: false
        default: ""

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 열쇠 파일
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          RAW=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r')
          BODY=$(printf '%s' "$RAW" | tr -d ' \n\t')
          if printf '%s' "$RAW" | grep -q "PRIVATE KEY-----"; then printf '%s\n' "$RAW" > "$KEY"
          elif DEC=$(printf '%s' "$BODY" | base64 --decode 2>/dev/null) && printf '%s' "$DEC" | grep -q "PRIVATE KEY-----"; then printf '%s\n' "$DEC" > "$KEY"
          else { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"; fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: 버전·글·빌드 준비, 제출
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SUBMIT: ${{ inputs.submit }}
          WHATS_NEW: ${{ inputs.whats_new }}
        run: node scripts/ios-submit.mjs
