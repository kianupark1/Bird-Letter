# 매일 낮 12시(한국 시간)에 promo/schedule.json 에서 "오늘 날짜" 글을 스레드·인스타그램에 올려요.
# 내 컴퓨터가 꺼져 있어도 GitHub 서버에서 돌아요. 실패하면 GitHub가 이메일로 알려 줘요.
# 비밀값이 없으면 실패로 끝나요(일정에 글이 있는 날만). 값 넣는 방법은 docs/자동게시-설정.md 를 보세요.
name: 홍보 글 자동 게시

on:
  schedule:
    - cron: "0 3 * * *" # UTC 03:00 = 한국 시간 12:00
  workflow_dispatch:
    inputs:
      send:
        description: "true 면 실제로 올리고, false 면 미리보기만 해요"
        default: "false"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 오늘 글 올리기
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SEND: ${{ github.event_name == 'schedule' && 'true' || inputs.send }}
        run: |
          if [ "$SEND" = "true" ]; then node scripts/auto-post.mjs --send; else node scripts/auto-post.mjs; fi
