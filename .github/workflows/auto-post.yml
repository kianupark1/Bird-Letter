# 매일 아침 8시 30분·저녁 6시·밤 10시 30분(한국 시간, 2026-11-09·11-10 대표님)에 promo/schedule.json 에서 "오늘 날짜" 글을 스레드·인스타그램(릴스)·X·유튜브 쇼츠에 올려요.
# 내 컴퓨터가 꺼져 있어도 GitHub 서버에서 돌아요. 실패하면 GitHub가 이메일로 알려 줘요.
# 기본은 꺼져 있어요(AUTO_POST_ENABLED 변수를 true로 해야 켜져요). 값 넣는 방법은 docs/자동게시-설정.md 를 보세요.
name: 홍보 글 자동 게시

on:
  # GitHub 예약 실행은 늦거나 빠질 때가 있어서(2026-11-10: 10시간 늦음) 한 번 더 시도하는 시각을 두고,
  # 무슨 글을 올릴지는 실행된 한국 시각으로 정해요(--slot auto). 이미 올린 글은 autopost-log 브랜치 기록으로 건너뛰어요.
  schedule:
    - cron: "33 23 * * *" # 한국 08:33 아침 글
    - cron: "13 1 * * *" # 한국 10:13 아침 글 다시 시도
    - cron: "37 8 * * *" # 한국 17:37 저녁 글
    - cron: "17 10 * * *" # 한국 19:17 저녁 글 다시 시도
    - cron: "31 13 * * *" # 한국 22:31 밤 글(2026-11-10 대표님)
    - cron: "57 13 * * *" # 한국 22:57 밤 글 다시 시도
  workflow_dispatch:
    inputs:
      send:
        description: "true 면 실제로 올리고, false 면 미리보기만 해요"
        default: "false"
      slot:
        description: "noon(아침 8시 30분 글)·evening(저녁 6시 글)·night(밤 10시 30분 글)"
        default: "noon"

jobs:
  post:
    # 레포 Settings → Secrets and variables → Actions → Variables 에 AUTO_POST_ENABLED = true 를 넣어야 켜져요(기본은 꺼짐)
    # 예약 실행은 AUTO_POST_ENABLED=true일 때만, 손으로 누른 실행(열쇠 확인·미리보기)은 언제나
    if: ${{ vars.AUTO_POST_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency: autopost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 올린 기록 가져오기
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          if git fetch -q origin autopost-log 2>/dev/null; then git show origin/autopost-log:posted.txt > "$RUNNER_TEMP/log/posted.txt" 2>/dev/null || true; fi
          cat promo/posted.txt >> "$RUNNER_TEMP/log/posted.txt" 2>/dev/null || true
          echo "LOG_FILE=$RUNNER_TEMP/log/posted.txt" >> "$GITHUB_ENV"
      - name: 오늘 글 올리기
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          SEND: ${{ github.event_name == 'schedule' && 'true' || inputs.send }}
          SLOT: ${{ github.event_name == 'schedule' && 'auto' || inputs.slot }}
        run: |
          if [ "$SEND" != "true" ]; then echo "── 열쇠 확인 ──"; node scripts/auto-post.mjs --check || echo "(열쇠가 아직 다 들어가지 않았어요 — 위 ✗ 줄을 보세요)"; echo "── 오늘 글 미리보기 ──"; fi
          if [ "$SEND" = "true" ]; then node scripts/auto-post.mjs --send --slot "$SLOT"; else node scripts/auto-post.mjs --slot "$SLOT"; fi
      - name: 올린 기록 남기기
        if: always()
        run: |
          cd "$RUNNER_TEMP/log"
          [ -s posted.txt ] || exit 0
          git init -q && git checkout -q -b autopost-log
          git config user.name "autopost" && git config user.email "autopost@users.noreply.github.com"
          git add posted.txt && git commit -qm "올린 기록" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" autopost-log || echo "기록 저장 실패(다음 실행에서 다시)"
